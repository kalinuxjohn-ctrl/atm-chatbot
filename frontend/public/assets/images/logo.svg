      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0d5f63"/>
    </linearGradient>
    <linearGradient id="logo-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee0d6"/>
      <stop offset="1" stop-color="#2bb3a9"/>
