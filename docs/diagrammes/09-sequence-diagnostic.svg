<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Diagramme de séquence d'un diagnostic : le message passe de l'interface au serveur métier, qui demande l'intention à l'IA, transforme la phrase en vecteur, cherche les cas proches dans la base, fait rédiger un résumé par l'IA, mémorise l'échange puis renvoie la réponse.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4f66"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3b4f66" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Participants : x = 80, 240, 420, 600, 770, 920 -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="20" y="20" width="120" height="44" rx="8" fill="#10243a"/><text x="80" y="47" fill="#fff">Technicien</text>
    <rect x="180" y="20" width="120" height="44" rx="8" fill="#f2f9f8" stroke="#127a76"/><text x="240" y="47" fill="#0d4f4c">Interface</text>
    <rect x="350" y="20" width="140" height="44" rx="8" fill="#eaf2fd" stroke="#1f6fd1"/><text x="420" y="47" fill="#1657a8">Serveur métier</text>
    <rect x="535" y="20" width="130" height="44" rx="8" fill="#fff4dd" stroke="#c98410"/><text x="600" y="47" fill="#5c3c00">IA de langage</text>
    <rect x="705" y="20" width="130" height="44" rx="8" fill="#fff4dd" stroke="#c98410"/><text x="770" y="40" fill="#5c3c00">Moteur de</text><text x="770" y="56" fill="#5c3c00">vecteurs</text>
    <rect x="860" y="20" width="120" height="44" rx="8" fill="#e6f5f3" stroke="#127a76"/><text x="920" y="47" fill="#0d4f4c">Base</text>
  </g>
  <g stroke="#9fb3c8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="80" y1="64" x2="80" y2="640"/><line x1="240" y1="64" x2="240" y2="640"/>
    <line x1="420" y1="64" x2="420" y2="640"/><line x1="600" y1="64" x2="600" y2="640"/>
    <line x1="770" y1="64" x2="770" y2="640"/><line x1="920" y1="64" x2="920" y2="640"/>
  </g>
  <!-- Activation du serveur métier -->
  <rect x="413" y="146" width="14" height="440" fill="#d5e5fa" stroke="#1f6fd1"/>

  <!-- Messages : trait plein = demande, pointillé = réponse -->
  <g stroke="#3b4f66" stroke-width="1.5" fill="none">
    <line x1="80" y1="110" x2="236" y2="110" marker-end="url(#arrow)"/>
    <line x1="240" y1="150" x2="410" y2="150" marker-end="url(#arrow)"/>
    <line x1="427" y1="190" x2="596" y2="190" marker-end="url(#arrow)"/>
    <line x1="600" y1="230" x2="431" y2="230" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="427" y1="270" x2="766" y2="270" marker-end="url(#arrow)"/>
    <line x1="770" y1="310" x2="431" y2="310" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="427" y1="350" x2="916" y2="350" marker-end="url(#arrow)"/>
    <line x1="920" y1="390" x2="431" y2="390" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="427" y1="430" x2="596" y2="430" marker-end="url(#arrow)"/>
    <line x1="600" y1="470" x2="431" y2="470" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="427" y1="510" x2="916" y2="510" marker-end="url(#arrow)"/>
    <line x1="413" y1="560" x2="244" y2="560" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="240" y1="610" x2="84" y2="610" stroke-dasharray="6 4" marker-end="url(#open)"/>
  </g>
  <g font-size="12" fill="#1d2d3d" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="158" y="102" text-anchor="middle">« le GAB a avalé la carte »</text>
    <text x="325" y="142" text-anchor="middle">message + GAB</text>
    <text x="512" y="182" text-anchor="middle">quelle intention ?</text>
    <text x="512" y="222" text-anchor="middle">diagnostic</text>
    <text x="596" y="262" text-anchor="middle">phrase à transformer</text>
    <text x="596" y="302" text-anchor="middle">empreinte (vecteur)</text>
    <text x="672" y="342" text-anchor="middle">cas proches, sur GAB uniquement</text>
    <text x="672" y="382" text-anchor="middle">2 interventions + leur fiabilité</text>
    <text x="512" y="422" text-anchor="middle">résume ces cas</text>
    <text x="512" y="462" text-anchor="middle">résumé en français</text>
    <text x="672" y="502" text-anchor="middle">mémorise l'échange et les résultats</text>
    <text x="328" y="552" text-anchor="middle">réponse</text>
    <text x="160" y="602" text-anchor="middle">affiche (et lit à voix haute)</text>
  </g>
  <g font-size="11" font-weight="700" fill="#1657a8">
    <text x="30" y="114">1</text><text x="30" y="154">2</text><text x="30" y="194">3</text>
    <text x="30" y="234">4</text><text x="30" y="274">5</text><text x="30" y="314">6</text>
    <text x="30" y="354">7</text><text x="30" y="394">8</text><text x="30" y="434">9</text>
    <text x="26" y="474">10</text><text x="26" y="514">11</text><text x="26" y="564">12</text><text x="26" y="614">13</text>
  </g>
</svg>
