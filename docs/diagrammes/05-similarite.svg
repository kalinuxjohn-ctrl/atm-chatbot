<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Recherche par similarité : chaque phrase est transformée en position sur une carte ; les phrases qui parlent de la même panne se retrouvent proches, même avec des mots différents ; seules les plus proches de la question sont retenues.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4f66"/></marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- Colonne gauche : transformation -->
  <text x="30" y="40" font-size="13" font-weight="700" fill="#10243a" letter-spacing="0.5">1 · Chaque phrase devient une position</text>
  <rect x="30" y="62" width="250" height="44" rx="8" fill="#fff" stroke="#1f6fd1" stroke-width="1.5"/>
  <text x="155" y="89" font-size="12.5" text-anchor="middle" fill="#10243a">« Le GAB a avalé la carte »</text>
  <line x1="155" y1="106" x2="155" y2="140" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="165" y="128" font-size="11.5" fill="#8a5a00">moteur de vecteurs</text>
  <rect x="30" y="146" width="250" height="44" rx="8" fill="#fff4dd" stroke="#c98410"/>
  <text x="155" y="173" font-size="12" text-anchor="middle" fill="#5c3c00" font-family="Consolas, monospace">[0,12 · −0,87 · 0,40 · … ]</text>
  <text x="30" y="222" font-size="12" fill="#5b6b7f">1 024 nombres : une « empreinte » du sens,</text>
  <text x="30" y="240" font-size="12" fill="#5b6b7f">pas des mots. Deux phrases qui veulent dire</text>
  <text x="30" y="258" font-size="12" fill="#5b6b7f">la même chose ont des empreintes voisines.</text>

  <text x="30" y="306" font-size="13" font-weight="700" fill="#10243a" letter-spacing="0.5">3 · On garde les plus proches</text>
  <text x="30" y="328" font-size="12" fill="#5b6b7f">Seuil de ressemblance réglable : en dessous,</text>
  <text x="30" y="346" font-size="12" fill="#5b6b7f">un cas n'est jamais montré, même s'il est</text>
  <text x="30" y="364" font-size="12" fill="#5b6b7f">« le moins éloigné ». Et la recherche reste</text>
  <text x="30" y="382" font-size="12" fill="#5b6b7f">limitée au même type d'appareil (GAB ou TPE).</text>

  <!-- Carte -->
  <text x="330" y="40" font-size="13" font-weight="700" fill="#10243a" letter-spacing="0.5">2 · Sur la carte du sens, les pannes semblables se regroupent</text>
  <rect x="330" y="56" width="610" height="350" rx="14" fill="#f6f9fc" stroke="#c9d6e3"/>
  <g stroke="#e1e8f0" stroke-width="1">
    <line x1="330" y1="143" x2="940" y2="143"/><line x1="330" y1="230" x2="940" y2="230"/><line x1="330" y1="318" x2="940" y2="318"/>
    <line x1="482" y1="56" x2="482" y2="406"/><line x1="635" y1="56" x2="635" y2="406"/><line x1="787" y1="56" x2="787" y2="406"/>
  </g>

  <!-- Zone retenue autour de la question -->
  <circle cx="560" cy="215" r="100" fill="#1f6fd1" fill-opacity="0.08" stroke="#1f6fd1" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text x="560" y="336" font-size="11.5" text-anchor="middle" fill="#1657a8" font-weight="600">zone « assez proche »</text>

  <!-- Groupe carte -->
  <circle cx="560" cy="215" r="9" fill="#1f6fd1"/>
  <text x="560" y="242" font-size="12" text-anchor="middle" fill="#1657a8" font-weight="700">la question</text>
  <circle cx="510" cy="172" r="7" fill="#127a76"/>
  <text x="452" y="152" font-size="11.5" text-anchor="end" fill="#0d4f4c">« carte retenue »</text>
  <circle cx="615" cy="260" r="7" fill="#127a76"/>
  <text x="668" y="264" font-size="11.5" fill="#0d4f4c">« carte coincée »</text>
  <circle cx="520" cy="270" r="7" fill="#127a76"/>
  <text x="452" y="292" font-size="11.5" text-anchor="end" fill="#0d4f4c">« carte non rendue »</text>

  <!-- Autres groupes -->
  <circle cx="800" cy="110" r="7" fill="#9fb3c8"/>
  <text x="812" y="114" font-size="11.5" fill="#5b6b7f">« billets bloqués »</text>
  <circle cx="770" cy="148" r="7" fill="#9fb3c8"/>
  <text x="782" y="152" font-size="11.5" fill="#5b6b7f">« bourrage de billets »</text>
  <circle cx="700" cy="350" r="7" fill="#9fb3c8"/>
  <text x="712" y="354" font-size="11.5" fill="#5b6b7f">« imprimante de reçus bloquée »</text>
  <circle cx="860" cy="300" r="7" fill="#9fb3c8"/>
  <text x="850" y="290" font-size="11.5" text-anchor="end" fill="#5b6b7f">« écran noir »</text>

  <!-- Légende -->
  <circle cx="350" cy="390" r="6" fill="#127a76"/><text x="362" y="394" font-size="11.5" fill="#1d2d3d">retenu</text>
  <circle cx="420" cy="390" r="6" fill="#9fb3c8"/><text x="432" y="394" font-size="11.5" fill="#1d2d3d">trop éloigné, ignoré</text>
</svg>
