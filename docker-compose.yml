services:

  db:
    image: pgvector/pgvector:pg16
    container_name: atm_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: atm_chatbot

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atm_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10


  init-db:
    build:
      context: .
      dockerfile: Dockerfile.init

    container_name: atm_init

    environment:
      PGPASSWORD: postgrespassword
      DATABASE_URL: ${DATABASE_URL}
      HF_HOME: ${HF_HOME}

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./docker-cache/huggingface:/root/.cache/huggingface

    # Applique chaque migration de db/migrations/*.sql UNE SEULE FOIS,
    # peu importe combien de fois ce conteneur redémarre -- une table
    # schema_migrations retient ce qui a déjà tourné. Avant ce correctif,
    # le script rejouait tout depuis zéro à chaque `docker compose up`,
    # ce qui échouait dès que la base n'était pas totalement vide
    # (ex: relance sans `down -v` entre deux tests).
    #
    # ON_ERROR_STOP=1 sur chaque appel psql : une vraie erreur SQL arrête
    # le script net (via `set -e`), au lieu de continuer en silence sur
    # les fichiers suivants comme c'était le cas avant.
    #
    # Ajouter une nouvelle migration = juste déposer le fichier dans
    # db/migrations/ -- rien à toucher ici, la boucle la ramasse toute seule.
    command:
      - sh
      - -c
      - |
        set -e

        psql -h db -U postgres -d atm_chatbot -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migrations (
            filename   TEXT PRIMARY KEY,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
        "

        for fichier in db/migrations/*.sql; do
          nom=$$(basename "$$fichier")
          deja_applique=$$(psql -h db -U postgres -d atm_chatbot -tAc \
            "SELECT 1 FROM schema_migrations WHERE filename = '$$nom'")

          if [ "$$deja_applique" = "1" ]; then
            echo "Migration déjà appliquée, ignorée : $$nom"
            continue
          fi

          echo "Application de la migration : $$nom"
          psql -h db -U postgres -d atm_chatbot -v ON_ERROR_STOP=1 -f "$$fichier"
          psql -h db -U postgres -d atm_chatbot -v ON_ERROR_STOP=1 -c \
            "INSERT INTO schema_migrations (filename) VALUES ('$$nom');"
        done

        # Idempotents par construction (ON CONFLICT ... DO NOTHING) --
        # peuvent donc tourner à chaque démarrage sans souci, contrairement
        # aux migrations ci-dessus.
        python -m db.seed.seed_demo_data
        python -m app.jobs.recompute_stats


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: atm_app
    restart: unless-stopped

    ports:
      - "8000:8000"

    gpus: all

    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      HF_HOME: ${HF_HOME}

    # Permet au conteneur de résoudre l'hôte WSL/Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      init-db:
        condition: service_completed_successfully

    volumes:
      - ./app:/app/app
      - ./docker-cache/huggingface:/root/.cache/huggingface

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload


volumes:
  pgdata: