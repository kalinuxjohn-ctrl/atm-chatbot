# Réglages communs à chaque location qui transmet vers un conteneur Node.

# Anti-CSRF : écriture (POST, PUT, PATCH, DELETE) venue d'une autre origine
# -> refusée ici, avant même d'atteindre le conteneur (voir la map
# $reject_cross_origin_request dans nginx.conf). `if` + `return` est l'usage
# sûr de `if` dans une location.
default_type application/json;
if ($reject_cross_origin_request) {
    return 403 '{"error":{"code":"access_denied","message":"Requête refusée : origine non autorisée."}}';
}

proxy_http_version 1.1;
proxy_set_header Host $host;
# L'adresse client est REMPLACÉE (et non ajoutée à une liste) : un client ne
# peut pas glisser une fausse adresse dans X-Forwarded-For pour contourner le
# verrouillage des connexions par IP.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;

proxy_connect_timeout 3s;
# proxy_read_timeout : 60 s par défaut (bloc http), allongé seulement pour le WebSocket.

# Conteneur arrêté ou injoignable : nginx répond 502/504 lui-même. On le
# transforme en 503 « service indisponible », pour CETTE fonctionnalité seulement.
# (On n'intercepte pas les erreurs renvoyées par l'application : ses JSON 4xx/5xx passent tels quels.)
error_page 502 504 =503 $feature_unavailable_location;
