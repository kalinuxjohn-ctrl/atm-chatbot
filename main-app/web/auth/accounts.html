<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comptes | Espace techniciens</title>
    <script src="/shared/js/applySavedTheme.js"></script>
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/auth/css/auth.css">
    <script type="module" src="/shared/js/connectedPageShell.js"></script>
    <script type="module" src="/auth/js/accountsPage.js"></script>
  </head>
  <body>
    <header data-page-shell></header>
    <main class="page-content accounts-layout">
      <div class="page-heading">
        <h1>Comptes des techniciens</h1>
        <p>Créez les accès, changez les rôles, désactivez un compte : ses sessions sont coupées aussitôt.</p>
      </div>
      <p class="form-error" data-page-error role="alert" hidden></p>

      <form class="card" data-account-creation-form data-administrator-only novalidate hidden>
        <div class="card-header">
          <h2>Créer un compte</h2>
          <span data-icon="users"></span>
        </div>
        <div class="account-creation-grid">
          <label class="form-field">Nom d'utilisateur
            <input name="username" required maxlength="30" autocapitalize="none" spellcheck="false" autocomplete="off">
          </label>
          <label class="form-field">Mot de passe initial
            <input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
          </label>
          <label class="form-field">Rôle
            <select name="role">
              <option value="technician">Technicien</option>
              <option value="moderator">Modérateur (gère tous les points)</option>
              <option value="admin">Administrateur</option>
            </select>
          </label>
          <label class="form-field">Nom complet (nouveau technicien)
            <input name="fullName" maxlength="200" autocomplete="off">
          </label>
          <label class="form-field">Ou technicien existant du chatbot (n°)
            <input name="existingTechnicianId" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          </label>
        </div>
        <p class="muted">Sans n° de technicien existant, un nouveau technicien est ajouté avec ce nom complet.</p>
        <p class="form-error" data-creation-error role="alert" hidden></p>
        <p class="form-success" data-creation-success role="status" hidden></p>
        <button class="button" type="submit">Créer le compte</button>
      </form>

      <section class="card" data-administrator-only hidden>
        <div class="card-header">
          <h2>Comptes existants</h2>
          <span class="badge" data-account-count></span>
        </div>
        <div class="accounts-table-wrapper">
          <table class="accounts-table">
            <thead>
              <tr><th>Utilisateur</th><th>Nom</th><th>N°</th><th>Rôle</th><th>État</th><th>Actions</th></tr>
            </thead>
            <tbody data-accounts-table-body></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
