<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte | Espace techniciens</title>
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/auth/css/auth.css">
    <script type="module" src="/auth/js/registerPage.js"></script>
  </head>
  <body>
    <main class="authentication-layout">
      <div class="card authentication-card" data-registration-closed hidden>
        <h1>Inscription fermée</h1>
        <p>Les comptes sont créés par un administrateur. Demandez-lui vos identifiants.</p>
        <p><a href="/auth/login.html">Retour à la connexion</a></p>
      </div>
      <form class="card authentication-card" data-registration-form novalidate hidden>
        <h1>Créer un compte</h1>
        <label class="form-field">Nom d'utilisateur
          <input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.\-]{3,30}" autocapitalize="none" spellcheck="false">
          <span class="muted">3 à 30 caractères : lettres sans accent, chiffres, _ . -</span>
        </label>
        <label class="form-field">Nom complet (facultatif)
          <input name="fullName" autocomplete="name" maxlength="200">
        </label>
        <label class="form-field">Mot de passe
          <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
          <span class="muted">10 caractères minimum.</span>
        </label>
        <label class="form-field">Confirmer le mot de passe
          <input name="passwordConfirmation" type="password" autocomplete="new-password" required maxlength="128">
        </label>
        <p class="form-error" data-form-error role="alert" hidden></p>
        <button class="button authentication-submit" type="submit">Créer le compte</button>
        <p class="authentication-footnote"><a href="/auth/login.html">J'ai déjà un compte</a></p>
      </form>
    </main>
  </body>
</html>
