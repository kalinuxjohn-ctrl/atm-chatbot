<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 855" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Contenu exact des deux appels à Claude : compréhension du message et rédaction de la réponse, avec ce qui n&#x27;est jamais envoyé.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4f66"/></marker>
  </defs>
  <rect width="1400" height="855" fill="#ffffff"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#10243a" text-anchor="start" xml:space="preserve">Ce que Claude reçoit, et ce qu&#x27;il renvoie</text>
<text x="30" y="62" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve">Chaque appel est UNE requête indépendante : aucun prompt système, aucun historique. Tout le contexte tient dans une seule chaîne de texte.</text>
<rect x="30" y="82" width="1340" height="70" rx="8" fill="#f6f9fc" stroke="#10243a" stroke-width="1.2"/>
<text x="46" y="104" font-size="12.5" font-weight="700" fill="#10243a" text-anchor="start" xml:space="preserve">Corps HTTP envoyé à api.anthropic.com/v1/messages (llm_service.py)</text>
<text x="46" y="130" font-size="12.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">{ &quot;model&quot;: &quot;claude-sonnet-5-5&quot;, &quot;max_tokens&quot;: 1024, &quot;messages&quot;: [ { &quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;&lt;le prompt ci-dessous&gt;&quot; } ] }</text>
<rect x="30" y="172" width="655" height="545" rx="12" fill="#fff4dd" stroke="#c98410" stroke-width="1.5"/>
<text x="50" y="200" font-size="16" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">Appel 1 · Comprendre</text>
<text x="50" y="219" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="start" xml:space="preserve">message_understanding_service.py — à CHAQUE message</text>
<text x="50" y="248" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">ENVOYÉ</text>
<rect x="50" y="256" width="615" height="198" rx="6" fill="#fff" stroke="#e3c37a" stroke-width="1"/>
<text x="62" y="276" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Tu es un module de compréhension pour un chatbot de</text>
<text x="62" y="292" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">techniciens de maintenance ATM (GAB/TPE).</text>
<text x="62" y="308" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Analyse UNIQUEMENT le message suivant et renvoie un JSON</text>
<text x="62" y="324" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">strict … avec EXACTEMENT ces clés : { intent, device_type_text,</text>
<text x="62" y="340" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">model_name_text, error_code_text, reformulated_problem_text }</text>
<text x="62" y="356" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Règles strictes :</text>
<text x="62" y="372" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">- diagnostic / detail_request / conversation (hors-sujet</text>
<text x="62" y="388" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  compris) ; n&#x27;invente jamais ; jamais d&#x27;ID de base …</text>
<text x="62" y="404" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Le type d&#x27;appareil choisi dans l&#x27;interface est : GAB. Privilégie</text>
<text x="62" y="420" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">ce type d&#x27;appareil … Mets &quot;gab&quot; dans &quot;device_type_text&quot; …</text>
<text x="62" y="436" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Message du technicien : « le GAB affiche E42 et garde la carte »</text>
<text x="50" y="482" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">REÇU</text>
<rect x="50" y="490" width="615" height="102" rx="6" fill="#fff" stroke="#e3c37a" stroke-width="1"/>
<text x="62" y="510" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">{ &quot;intent&quot;: &quot;diagnostic&quot;,</text>
<text x="62" y="526" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  &quot;device_type_text&quot;: &quot;gab&quot;,</text>
<text x="62" y="542" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  &quot;model_name_text&quot;: null,</text>
<text x="62" y="558" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  &quot;error_code_text&quot;: &quot;E42&quot;,</text>
<text x="62" y="574" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  &quot;reformulated_problem_text&quot;: &quot;Carte retenue, code E42&quot; }</text>
<text x="50" y="620" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">À QUOI ÇA SERT</text>
<text x="50" y="640" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• choisir la branche : recherche, détail ou simple réponse ;</text>
<text x="50" y="657" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• extraire le code d&#x27;erreur / modèle → vérifiés ensuite en base ;</text>
<text x="50" y="674" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• donner une phrase propre à vectoriser par Voyage AI.</text>
<text x="50" y="691" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">JSON illisible → HTTP 503, on ne devine jamais l&#x27;intention.</text>
<rect x="715" y="172" width="655" height="545" rx="12" fill="#fff4dd" stroke="#c98410" stroke-width="1.5"/>
<text x="735" y="200" font-size="16" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">Appel 2 · Rédiger la réponse</text>
<text x="735" y="219" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="start" xml:space="preserve">chat_orchestrator_service.py / llm_service.py</text>
<text x="735" y="248" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">ENVOYÉ</text>
<rect x="735" y="256" width="615" height="182" rx="6" fill="#fff" stroke="#e3c37a" stroke-width="1"/>
<text x="747" y="276" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Tu es un assistant pour techniciens de maintenance ATM.</text>
<text x="747" y="292" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Le type d&#x27;appareil choisi dans l&#x27;interface est : GAB. Privilégie …</text>
<text x="747" y="308" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Un technicien décrit ce symptôme : « Carte retenue, code E42 ».</text>
<text x="747" y="324" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Voici des cas réels déjà enregistrés, du plus au moins pertinent :</text>
<text x="747" y="340" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Cas 1 (Alan Martin, Agence Centre) : symptôme « carte bloquée »,</text>
<text x="747" y="356" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">actions tentées : réinitialiser le lecteur puis tester,</text>
<text x="747" y="372" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">résultat : resolved (fiabilité connue : 80% sur 5 cas).</text>
<text x="747" y="388" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Cas 2 (…) …            (3 cas maximum)</text>
<text x="747" y="404" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">Résume ces cas en langage naturel … garde l&#x27;ordre Cas 1 / Cas 2.</text>
<text x="747" y="420" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">N&#x27;invente AUCUNE information absente de la liste ci-dessus.</text>
<text x="735" y="466" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">REÇU</text>
<rect x="735" y="474" width="615" height="54" rx="6" fill="#fff" stroke="#e3c37a" stroke-width="1"/>
<text x="747" y="494" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">« Deux interventions similaires ont été résolues en</text>
<text x="747" y="510" font-size="11" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">  réinitialisant le lecteur de carte… »</text>
<text x="735" y="556" font-size="11" font-weight="700" fill="#5c3c00" text-anchor="start" xml:space="preserve">À QUOI ÇA SERT</text>
<text x="735" y="576" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• reformuler les cas trouvés en français clair, dans l&#x27;ordre ;</text>
<text x="735" y="593" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• autres variantes : stats agrégées (symptôme/action/fiabilité),</text>
<text x="735" y="610" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">  détail d&#x27;UN cas + question du technicien, ou message seul</text>
<text x="735" y="627" font-size="12" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">  (salutation, hors-sujet → phrase de refus fixe).</text>
<rect x="30" y="737" width="1340" height="96" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="1.3"/>
<text x="48" y="761" font-size="13.5" font-weight="700" fill="#7a1f16" text-anchor="start" xml:space="preserve">Jamais envoyé à Claude</text>
<text x="48" y="783" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• les messages précédents de la conversation   • le reste du contexte JSONB (last_search, selected_result, IDs résolus)</text>
<text x="48" y="800" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">• le diagnostic, la date d&#x27;ouverture et le résultat de chaque action (chargés par build_case mais non mis en texte)   • les vecteurs, les IDs de base</text>
<text x="48" y="817" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">Par contre, le nom du technicien et le site de l&#x27;appareil font partie du texte des cas → ils sont envoyés à Anthropic.</text>
</svg>
