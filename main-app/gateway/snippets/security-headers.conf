# En-têtes de sécurité posés sur TOUTES les réponses.
#
# À inclure dans CHAQUE location : nginx ne fait pas hériter les add_header du
# bloc server dès qu'une location déclare les siens. Le snippet unique évite
# d'oublier un en-tête dans une location.
#
# La CSP et la Permissions-Policy varient selon la fonctionnalité (carte,
# messagerie, appels) : leur valeur vient des variables
# $content_security_policy et $permissions_policy, calculées dans nginx.conf.
# `always` : les en-têtes partent aussi sur les réponses d'erreur (4xx, 5xx).

add_header Content-Security-Policy $content_security_policy always;
add_header Permissions-Policy $permissions_policy always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Doublon de frame-ancestors 'none' pour les anciens navigateurs.
add_header X-Frame-Options "DENY" always;
