<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1267" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Diagramme de séquence d&#x27;un message de diagnostic entre navigateur, serveur frontend, backend, Claude, Voyage AI et PostgreSQL.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4f66"/></marker>
  </defs>
  <rect width="1400" height="1267" fill="#ffffff"/>
<text x="30" y="40" font-size="20" font-weight="700" fill="#10243a" text-anchor="start" xml:space="preserve">Séquence détaillée d&#x27;un message de diagnostic</text>
<text x="30" y="62" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve">Exemple : « le GAB affiche E42 et garde la carte » — de l&#x27;envoi à l&#x27;affichage de la réponse.</text>
<rect x="20" y="80" width="180" height="52" rx="10" fill="#f6f9fc" stroke="#10243a" stroke-width="1.5"/>
<text x="110" y="103" font-size="14" font-weight="700" fill="#10243a" text-anchor="middle" xml:space="preserve">Navigateur</text>
<text x="110" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">technicien</text>
<rect x="240" y="80" width="180" height="52" rx="10" fill="#f6f9fc" stroke="#10243a" stroke-width="1.5"/>
<text x="330" y="103" font-size="14" font-weight="700" fill="#10243a" text-anchor="middle" xml:space="preserve">server.py</text>
<text x="330" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">proxy frontend</text>
<rect x="490" y="80" width="180" height="52" rx="10" fill="#eaf2fd" stroke="#1f6fd1" stroke-width="1.5"/>
<text x="580" y="103" font-size="14" font-weight="700" fill="#1657a8" text-anchor="middle" xml:space="preserve">Backend FastAPI</text>
<text x="580" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">orchestrateur</text>
<rect x="740" y="80" width="180" height="52" rx="10" fill="#fff4dd" stroke="#c98410" stroke-width="1.5"/>
<text x="830" y="103" font-size="14" font-weight="700" fill="#5c3c00" text-anchor="middle" xml:space="preserve">Claude</text>
<text x="830" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">API Anthropic</text>
<rect x="970" y="80" width="180" height="52" rx="10" fill="#f1edfc" stroke="#6b4fc9" stroke-width="1.5"/>
<text x="1060" y="103" font-size="14" font-weight="700" fill="#3e2a8a" text-anchor="middle" xml:space="preserve">Voyage AI</text>
<text x="1060" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">embeddings</text>
<rect x="1190" y="80" width="180" height="52" rx="10" fill="#e8f5f4" stroke="#127a76" stroke-width="1.5"/>
<text x="1280" y="103" font-size="14" font-weight="700" fill="#0d4f4c" text-anchor="middle" xml:space="preserve">PostgreSQL</text>
<text x="1280" y="121" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle" xml:space="preserve">+ pgvector</text>
<line x1="110" y1="132" x2="110" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="330" y1="132" x2="330" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="580" y1="132" x2="580" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="830" y1="132" x2="830" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="1060" y1="132" x2="1060" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="1280" y1="132" x2="1280" y2="1163" stroke="#9fb3c8" stroke-dasharray="4 4"/>
<line x1="114" y1="175" x2="324" y2="175" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="132" cy="157" r="11" fill="#10243a"/><text x="132" y="161" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">1</text>
<text x="150" y="161" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /api/chat</text>
<text x="150" y="191" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ technician_id, message, conversation_id, device_type:&quot;gab&quot; }</text>
<line x1="334" y1="233" x2="574" y2="233" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="352" cy="215" r="11" fill="#10243a"/><text x="352" y="219" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">2</text>
<text x="370" y="219" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">relaie la requête</text>
<text x="370" y="249" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">→ http://127.0.0.1:8000/api/chat</text>
<line x1="584" y1="291" x2="1274" y2="291" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="273" r="11" fill="#127a76"/><text x="602" y="277" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">3</text>
<text x="620" y="277" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">charge conversation + contexte, enregistre le message user</text>
<text x="620" y="307" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">SELECT conversation_context · INSERT conversation_message</text>
<line x1="584" y1="349" x2="824" y2="349" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="331" r="11" fill="#c98410"/><text x="602" y="335" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">4</text>
<text x="620" y="335" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Appel 1 · consignes + type d&#x27;appareil de l&#x27;interface + message brut</text>
<text x="620" y="365" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">messages:[{role:&quot;user&quot;, content:&quot;…Message du technicien : « … »&quot;}]</text>
<line x1="826" y1="407" x2="586" y2="407" stroke="#3b4f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="602" cy="389" r="11" fill="#c98410"/><text x="602" y="393" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">5</text>
<text x="620" y="393" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">JSON de compréhension</text>
<text x="620" y="423" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ intent:&quot;diagnostic&quot;, error_code_text:&quot;E42&quot;, reformulated_problem_text:&quot;…&quot; }</text>
<rect x="430" y="443" width="300" height="78" rx="8" fill="#eaf2fd" stroke="#1f6fd1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="442" y="461" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">Routage selon intent :</text>
<text x="442" y="477" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">diagnostic → recherche (suite ci-dessous)</text>
<text x="442" y="493" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">detail_request → reprend un cas de last_search</text>
<text x="442" y="509" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">conversation → réponse courte (appel 2 seul)</text>
<line x1="584" y1="565" x2="1274" y2="565" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="547" r="11" fill="#127a76"/><text x="602" y="551" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">6</text>
<text x="620" y="551" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">résout les références : E42 → error_code_id, modèle → model_id</text>
<text x="620" y="581" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">SELECT … FROM error_code / device_model</text>
<line x1="584" y1="623" x2="1054" y2="623" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="605" r="11" fill="#6b4fc9"/><text x="602" y="609" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">7</text>
<text x="620" y="609" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">vectorise le texte reformulé</text>
<text x="620" y="639" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ input:[&quot;…&quot;], model:&quot;voyage-3-large&quot;, input_type:&quot;query&quot; }</text>
<line x1="1056" y1="681" x2="586" y2="681" stroke="#3b4f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="602" cy="663" r="11" fill="#6b4fc9"/><text x="602" y="667" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">8</text>
<text x="620" y="667" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">vecteur de 1024 nombres</text>
<text x="620" y="697" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[0.012, -0.044, 0.031, … ]</text>
<line x1="584" y1="739" x2="1274" y2="739" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="721" r="11" fill="#127a76"/><text x="602" y="725" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">9</text>
<text x="620" y="725" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">recherche des symptômes proches (même device_type)</text>
<text x="620" y="755" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ORDER BY embedding &lt;=&gt; :vecteur LIMIT 8 · seuil similarité ≥ 0,5</text>
<line x1="1276" y1="797" x2="586" y2="797" stroke="#3b4f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="602" cy="779" r="11" fill="#127a76"/><text x="602" y="783" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">10</text>
<text x="620" y="783" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">interventions, actions, technicien, site, fiabilité</text>
<text x="620" y="813" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3 meilleurs cas (un par intervention)</text>
<rect x="430" y="833" width="300" height="78" rx="8" fill="#eaf2fd" stroke="#1f6fd1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="442" y="851" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">Mise en texte des cas (_format_case) :</text>
<text x="442" y="867" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">« Cas 1 (Alan, Agence X) : symptôme « … »,</text>
<text x="442" y="883" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">actions tentées : A puis B, résultat : resolved</text>
<text x="442" y="899" font-size="11.5" font-weight="400" fill="#1d2d3d" text-anchor="start" xml:space="preserve">(fiabilité connue : 80% sur 5 cas). »</text>
<line x1="584" y1="955" x2="824" y2="955" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="937" r="11" fill="#c98410"/><text x="602" y="941" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">11</text>
<text x="620" y="941" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Appel 2 · consignes + type d&#x27;appareil + symptôme + cas en texte</text>
<text x="620" y="971" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">« Résume ces cas… N&#x27;invente AUCUNE information… »</text>
<line x1="826" y1="1013" x2="586" y2="1013" stroke="#3b4f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="602" cy="995" r="11" fill="#c98410"/><text x="602" y="999" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">12</text>
<text x="620" y="999" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">résumé en français pour le technicien</text>
<text x="620" y="1029" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">si échec → la liste brute des cas sert de réponse</text>
<line x1="584" y1="1071" x2="1274" y2="1071" stroke="#3b4f66" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="602" cy="1053" r="11" fill="#127a76"/><text x="602" y="1057" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">13</text>
<text x="620" y="1057" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">enregistre la réponse + le contexte, COMMIT</text>
<text x="620" y="1087" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">INSERT conversation_message · UPSERT conversation_context</text>
<line x1="576" y1="1129" x2="116" y2="1129" stroke="#3b4f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="132" cy="1111" r="11" fill="#10243a"/><text x="132" y="1115" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">14</text>
<text x="150" y="1115" font-size="12" font-weight="600" fill="#1d2d3d" text-anchor="start" xml:space="preserve" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">réponse affichée (repasse par server.py)</text>
<text x="150" y="1145" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve" font-family="Consolas, 'Courier New', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ conversation_id: 42, reply: &quot;…&quot; }</text>
<rect x="30" y="1177" width="1340" height="64" rx="8" fill="#fff" stroke="#9fb3c8" stroke-width="1"/>
<text x="46" y="1199" font-size="11.5" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve">Pas de cas en 10 → recherche des statistiques agrégées (symptom_action_outcome_stats) puis appel 2 avec ces solutions ; toujours rien → réponse fixe, sans IA.</text>
<text x="46" y="1217" font-size="11.5" font-weight="400" fill="#5b6b7f" text-anchor="start" xml:space="preserve">Claude ou Voyage indisponible → HTTP 503 « chatbot saturé » pour le technicien ; la cause précise n&#x27;apparaît que dans les journaux du serveur.</text>
</svg>
