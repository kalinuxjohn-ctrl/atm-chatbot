<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Boucle d'apprentissage : le technicien enregistre son intervention, le symptôme est rapproché du catalogue, les statistiques de fiabilité sont recalculées, et le technicien suivant reçoit de meilleures pistes, qui seront à leur tour enregistrées.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#127a76"/></marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>

  <!-- Centre -->
  <circle cx="450" cy="220" r="78" fill="#f2f9f8" stroke="#cfe7e3"/>
  <text x="450" y="212" font-size="14" font-weight="700" text-anchor="middle" fill="#0d4f4c">Plus il sert,</text>
  <text x="450" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#0d4f4c">plus il est utile</text>

  <!-- Étapes -->
  <rect x="300" y="20" width="300" height="74" rx="12" fill="#10243a"/>
  <text x="450" y="48" font-size="13.5" font-weight="700" text-anchor="middle" fill="#fff">1 · Le technicien enregistre</text>
  <text x="450" y="68" font-size="12" text-anchor="middle" fill="#b9c8d8">symptômes, actions tentées,</text>
  <text x="450" y="84" font-size="12" text-anchor="middle" fill="#b9c8d8">ce qui a vraiment marché</text>

  <rect x="610" y="183" width="270" height="74" rx="12" fill="#fff" stroke="#127a76" stroke-width="1.6"/>
  <text x="745" y="211" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0d4f4c">2 · Rapprochement au catalogue</text>
  <text x="745" y="231" font-size="12" text-anchor="middle" fill="#2f5f5c">automatique si la phrase est quasi</text>
  <text x="745" y="247" font-size="12" text-anchor="middle" fill="#2f5f5c">identique, sinon décision humaine</text>

  <rect x="300" y="346" width="300" height="74" rx="12" fill="#fff" stroke="#127a76" stroke-width="1.6"/>
  <text x="450" y="374" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0d4f4c">3 · Fiabilités recalculées</text>
  <text x="450" y="394" font-size="12" text-anchor="middle" fill="#2f5f5c">réussites ÷ essais, par symptôme,</text>
  <text x="450" y="410" font-size="12" text-anchor="middle" fill="#2f5f5c">par action et par type d'appareil</text>

  <rect x="20" y="183" width="270" height="74" rx="12" fill="#eaf2fd" stroke="#1f6fd1" stroke-width="1.6"/>
  <text x="155" y="211" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1657a8">4 · Meilleures pistes</text>
  <text x="155" y="231" font-size="12" text-anchor="middle" fill="#1d2d3d">le technicien suivant voit</text>
  <text x="155" y="247" font-size="12" text-anchor="middle" fill="#1d2d3d">d'abord ce qui marche le plus</text>

  <!-- Flèches du cycle -->
  <g stroke="#127a76" stroke-width="2" fill="none">
    <path d="M600 70 C 700 80, 745 120, 745 178" marker-end="url(#arrow)"/>
    <path d="M745 257 C 745 320, 700 370, 605 380" marker-end="url(#arrow)"/>
    <path d="M300 380 C 200 370, 155 320, 155 262" marker-end="url(#arrow)"/>
    <path d="M155 183 C 155 120, 200 80, 295 62" marker-end="url(#arrow)"/>
  </g>
</svg>
