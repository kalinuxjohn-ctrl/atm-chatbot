# ============================================================================
# main-app-gateway : SEUL point d'entrée public de la main app.
# ============================================================================
# - route chaque fonctionnalité vers son conteneur (auth, map, messaging, calls) ;
# - pose les en-têtes de sécurité (snippets/security-headers.conf) ;
# - limite le débit (connexion, inscription, messages, envois de fichiers) ;
# - refuse les requêtes d'écriture venant d'une autre origine (anti-CSRF) ;
# - sert les pages communes (accueil, administration, onglet ATM-Chatbot,
#   CSS/JS partagés, « service indisponible ») ;
# - sert l’ATM-Chatbot (frontend du chatbot) sous /atm-chatbot/app/, aux seuls
#   utilisateurs connectés (auth_request), en transmettant au chatbot le
#   technicien connecté et le secret partagé qui prouve que l'info vient d'ici ;
# - relaie l'administration de l’ATM-Chatbot (/api/atm-chatbot-admin/) vers l'API du
#   chatbot, réservée aux administrateurs connectés (auth_request), en ajoutant
#   lui-même la clé ADMIN_API_KEY : elle n'arrive jamais dans le navigateur.
#
# Il ne lit jamais le corps des requêtes : la validation est faite par les
# conteneurs Node. Un conteneur arrêté ne fait pas planter le gateway : sa
# fonctionnalité répond 503 « indisponible », les autres continuent.
# ============================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;
    sendfile on;
    keepalive_timeout 65s;

    # Image non-root et système de fichiers en lecture seule : tout fichier
    # temporaire va dans /tmp (tmpfs).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format main_app_access escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
        '"status":$status,"duration":$request_time,"bytes":$body_bytes_sent}';
    # $uri et non $request_uri : la query string (curseurs, coordonnées) ne va pas dans les journaux.
    access_log /dev/stdout main_app_access;

    # Par défaut, aucun gros corps de requête : seules les pièces jointes y ont droit.
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_read_timeout 60s;

    # DNS interne de Docker, interrogé à CHAQUE requête (proxy_pass avec variable).
    # Avec une adresse fixe, nginx refuserait de démarrer si un conteneur était
    # arrêté ; ici, seul l'accès à ce conteneur échoue (-> 503).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # --- Limitation de débit, par adresse client ---------------------------------
    limit_req_zone $binary_remote_addr zone=login_attempts:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=registration_attempts:10m rate=5r/m;
    limit_req_zone $message_write_limit_key zone=message_writes:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=attachment_uploads:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=20r/s;
    limit_req_status 429;

    # Seules les ÉCRITURES de messages sont limitées : la lecture par polling
    # (GET toutes les 3 s) utilise la même URL. Clé vide = pas de limite.
    map $request_method $message_write_limit_key {
        POST    $binary_remote_addr;
        default "";
    }

    # --- Anti-CSRF : une requête qui modifie quelque chose doit venir de notre origine ---
    # On compare l'hôte de l'en-tête Origin à l'en-tête Host reçu (même valeur
    # si la page vient de chez nous). Le cookie SameSite=Lax protège déjà ; ce
    # contrôle couvre en plus les navigateurs anciens et les sous-domaines.
    map $request_method $is_state_changing_request {
        GET     0;
        HEAD    0;
        OPTIONS 0;
        default 1;
    }
    map "$http_origin#$http_host" $origin_matches_host {
        "~^https?://(?<origin_host>[^/#]+)#\k<origin_host>$" 1;
        default 0;
    }
    map "$is_state_changing_request:$origin_matches_host" $reject_cross_origin_request {
        "1:0"   1;
        default 0;
    }

    # --- Content-Security-Policy : stricte partout, dérogations par fonctionnalité ---
    # Aucune 'unsafe-inline' : pas de script ni de style écrit dans le HTML.
    # connect-src : ws:/wss: du même hôte, car chaque page connectée ouvre le
    # WebSocket des appels pour être prévenue d'un appel entrant (dérogation
    # documentée dans docs/main-app.md).
    # $request_uri (adresse demandée) et non $uri : une page de repli (« service
    # indisponible ») garde les règles de la page demandée, iframe de l’ATM-Chatbot comprise.
    map $request_uri $content_security_policy {
        # MapLibre dessine la carte dans un Web Worker créé depuis une URL blob:.
        "~^/map(/|$)"
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
        # Lecture des messages vocaux et des enregistrements avant envoi (blob:).
        "~^/messaging(/|$)"
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
        # Audio de l'appel (flux WebRTC) et WebSocket de signalisation.
        "~^/calls(/|$)"
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
        # Pages du chatbot (/atm-chatbot/app/) : affichées dans l'onglet ATM-Chatbot (frame-ancestors 'self'),
        # police Google Fonts, styles posés par le JavaScript du chatbot, audio de la synthèse vocale.
        # (Avant la règle /atm-chatbot : la première expression qui correspond l'emporte.)
        "~^/atm-chatbot/app/"
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'";
        # Onglet ATM-Chatbot : affiche /atm-chatbot/app/ (même site) dans une iframe.
        "~^/atm-chatbot(/|$)"
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
        default
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    }

    # --- Permissions-Policy : tout est bloqué, sauf le strict nécessaire par page ---
    map $request_uri $permissions_policy {
        # « Ma position » sur la carte (jamais envoyée au serveur sans action de l'utilisateur).
        "~^/map(/|$)"
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()";
        # Enregistrement des messages vocaux.
        "~^/messaging(/|$)"
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()";
        # Micro pour l'appel, lecture automatique de la voix de l'interlocuteur.
        "~^/calls(/|$)"
            "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()";
        # ATM-Chatbot : dictée et chat vocal (micro), lecture des réponses à voix haute.
        "~^/atm-chatbot(/|$)"
            "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()";
        default
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()";
    }

    # Page ou JSON « service indisponible », selon ce qui était demandé.
    map $uri $feature_unavailable_location {
        "~^/api/"             /__unavailable/api.json;
        "~^/atm-chatbot/app/api/" /__unavailable/api.json;
        default               /__unavailable/page.html;
    }

    # X-Frame-Options : seules les pages du chatbot peuvent être affichées dans une
    # iframe, et seulement par ce site (l'onglet ATM-Chatbot).
    map $request_uri $frame_options {
        "~^/atm-chatbot/app/" SAMEORIGIN;
        default           DENY;
    }

    # Pour le WebSocket : Connection: upgrade seulement si le client le demande.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        # Conteneurs joints par leur nom Docker, résolu à chaque requête (voir resolver).
        set $auth_container      http://main-app-auth:3000;
        set $map_container       http://main-app-map:3000;
        set $messaging_container http://main-app-messaging:3000;
        set $calls_container     http://main-app-calls:3000;
        # Chatbot, joint sous les noms que lui donne docker-compose.main-app.yml :
        # son API (service `web`) et son frontend (service `chatbot-frontend`).
        set $chatbot_api_container      http://chatbot-api:8000;
        set $chatbot_frontend_container http://chatbot-frontend:5173;

        # Réglages de l’ATM-Chatbot venant de l'environnement du conteneur : le fichier
        # /tmp/atm-chatbot-settings.conf est écrit AU DÉMARRAGE par l'image nginx à partir
        # de templates/atm-chatbot-settings.conf.template. Valeurs vides par défaut
        # (et au `nginx -t` du build, où le fichier n'existe pas encore).
        set $atm_chatbot_admin_api_key       "";
        set $atm_chatbot_gateway_secret      "";
        include /tmp/atm-chatbot-settings*.conf;

        # --- Pages et fichiers servis par le gateway lui-même ------------------
        location = /health {
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/json;
            return 200 '{"status":"ok","feature":"gateway"}';
        }

        # Accueil : revalidé à chaque chargement, comme /shared/ (sinon l'ancien HTML
        # pourrait appeler des scripts qui n'existent plus).
        location = / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /home.html =404;
        }

        # CSS/JS communs : revalidés à chaque chargement (ETag -> 304), pour qu'une
        # mise à jour soit prise tout de suite, en même temps que les pages des conteneurs.
        location /shared/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # --- Administration : HTML et fichiers réservés aux sessions admin ----------
        location = /admin {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /admin/;
        }
        location /admin/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            auth_request /__internal/administrator-check;
            error_page 401 = @administration_login_required;
            error_page 403 = @administration_home_required;
            error_page 500 =503 /__unavailable/page.html;
        }
        location @administration_login_required {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            return 302 /auth/login.html?next=/admin/;
        }
        location @administration_home_required {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            return 302 /;
        }
        # Ancienne page des comptes : désormais une rubrique de l'administration.
        location = /auth/accounts.html {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /admin/#comptes;
        }

        # --- Onglet ATM-Chatbot : le chatbot affiché dans la page, sous la navigation -----
        location = /atm-chatbot {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /atm-chatbot/;
        }
        location /atm-chatbot/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # --- Le chatbot lui-même (pages, API, synthèse vocale), réservé aux connectés ---
        # /atm-chatbot/app/X devient /X sur le frontend du chatbot, qui relaie /api/ à son API.
        # 1. auth_request : le conteneur auth vérifie la session et renvoie le n° du technicien ;
        # 2. le gateway pose X-Authenticated-Technician-Id et X-Atm-Chatbot-Gateway-Secret
        #    (ceux qu'un client enverrait sont écrasés) : l'API du chatbot ne croit QUE ces en-têtes.
        location = /atm-chatbot/app {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /atm-chatbot/app/;
        }
        location = /atm-chatbot/app/ {
            include /etc/nginx/snippets/security-headers.conf;
            return 302 /;
        }
        location = /atm-chatbot/app/index.html {
            include /etc/nginx/snippets/security-headers.conf;
            return 302 /;
        }
        # L'administration du chatbot se fait dans /admin/ (sans clé à saisir).
        location ~ ^/atm-chatbot/app/(admin\.html|api/admin(/|$)) {
            include /etc/nginx/snippets/security-headers.conf;
            return 301 /admin/;
        }
        location /atm-chatbot/app/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            # Une page du chatbot charge une trentaine de fichiers d'un coup.
            limit_req zone=general_api burst=120 nodelay;
            auth_request /__internal/session-check;
            auth_request_set $authenticated_technician_id $upstream_http_x_authenticated_technician_id;
            error_page 401 = @atm_chatbot_login_required;
            error_page 500 =503 $feature_unavailable_location;
            proxy_set_header X-Authenticated-Technician-Id $authenticated_technician_id;
            proxy_set_header X-Atm-Chatbot-Gateway-Secret $atm_chatbot_gateway_secret;
            proxy_set_header X-Admin-Key "";
            # Photo jointe au message (réduite par le navigateur) ; réponse de l'IA parfois lente.
            client_max_body_size 8m;
            proxy_read_timeout 300s;
            rewrite ^/atm-chatbot/app/(.*)$ /$1 break;
            proxy_pass $chatbot_frontend_container;
        }
        location = /__internal/session-check {
            internal;
            proxy_pass $auth_container/api/auth/internal/session-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
        }
        location @atm_chatbot_login_required {
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/json;
            return 401 '{"detail":"Connectez-vous à l’Espace techniciens pour utiliser l’ATM-Chatbot.","error":{"code":"authentication_required","message":"Connectez-vous pour continuer."}}';
        }

        # --- Administration de l’ATM-Chatbot : relais vers l'API admin du chatbot ----------
        # 1. auth_request demande au conteneur auth si la session est celle d'un admin ;
        # 2. si oui, /api/atm-chatbot-admin/X devient /api/admin/X sur le chatbot, avec la
        #    clé X-Admin-Key ajoutée ICI (celle qu'un client enverrait est écrasée).
        location /api/atm-chatbot-admin/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=general_api burst=40 nodelay;
            auth_request /__internal/administrator-check;
            error_page 401 = @atm_chatbot_admin_login_required;
            error_page 403 = @atm_chatbot_admin_forbidden;
            # auth injoignable : auth_request répond 500 -> « service indisponible ».
            error_page 500 =503 $feature_unavailable_location;
            proxy_set_header X-Admin-Key $atm_chatbot_admin_api_key;
            rewrite ^/api/atm-chatbot-admin/(.*)$ /api/admin/$1 break;
            proxy_pass $chatbot_api_container;
        }
        location = /__internal/administrator-check {
            internal;
            proxy_pass $auth_container/api/auth/internal/administrator-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
        }
        location @atm_chatbot_admin_login_required {
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/json;
            return 401 '{"error":{"code":"authentication_required","message":"Connectez-vous pour continuer."}}';
        }
        location @atm_chatbot_admin_forbidden {
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/json;
            return 403 '{"error":{"code":"access_denied","message":"Réservé aux administrateurs."}}';
        }

        # Réponses de repli, inaccessibles directement (internal).
        location /__unavailable/ {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Retry-After "30" always;
            add_header Cache-Control "no-store" always;
        }

        # Les routes /internal/ ne sont jamais exposées, même si un conteneur en définissait.
        location ~ ^/(api/[a-z]+/)?internal(/|$) {
            include /etc/nginx/snippets/security-headers.conf;
            return 404;
        }

        # --- auth ---------------------------------------------------------------
        location = /api/auth/login {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=login_attempts burst=5 nodelay;
            proxy_pass $auth_container;
        }
        location = /api/auth/register {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=registration_attempts burst=3 nodelay;
            proxy_pass $auth_container;
        }
        location /auth/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass $auth_container;
        }
        location /api/auth/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=general_api burst=40 nodelay;
            proxy_pass $auth_container;
        }

        # --- map ----------------------------------------------------------------
        location /map/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass $map_container;
        }
        # Les tuiles arrivent par dizaines quand on déplace la carte : pas de limite générale ici,
        # le conteneur map garde un cache et ne relaie que des z/x/y valides.
        location /api/map/tiles/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass $map_container;
        }
        location /api/map/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=general_api burst=40 nodelay;
            proxy_pass $map_container;
        }

        # --- messaging ----------------------------------------------------------
        location /messaging/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass $messaging_container;
        }
        # Envoi d'une pièce jointe : la SEULE route qui accepte un gros corps.
        # La taille exacte est revérifiée par le conteneur (MAIN_APP_UPLOAD_MAX_BYTES).
        location ~ ^/api/messaging/conversations/[0-9]+/attachments$ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            client_max_body_size 12m;
            limit_req zone=attachment_uploads burst=5 nodelay;
            proxy_request_buffering on;
            proxy_pass $messaging_container;
        }
        location ~ ^/api/messaging/conversations/[0-9]+/messages$ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=message_writes burst=20 nodelay;
            proxy_pass $messaging_container;
        }
        location /api/messaging/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=general_api burst=40 nodelay;
            proxy_pass $messaging_container;
        }

        # --- calls --------------------------------------------------------------
        location /calls/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_pass $calls_container;
        }
        # WebSocket de signalisation : connexion longue, en-têtes Upgrade transmis.
        location = /api/calls/ws {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass $calls_container;
        }
        location /api/calls/ {
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-common.conf;
            limit_req zone=general_api burst=40 nodelay;
            proxy_pass $calls_container;
        }

        # Tout le reste : page inconnue.
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            return 404;
        }
    }
}
