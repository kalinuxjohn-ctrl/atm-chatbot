<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appels | Espace techniciens</title>
    <script src="/shared/js/applySavedTheme.js"></script>
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/calls/css/calls.css">
    <script type="module" src="/shared/js/connectedPageShell.js"></script>
    <script type="module" src="/calls/js/callsPage.js"></script>
  </head>
  <!-- Cette page gère elle-même le WebSocket des appels : pas de second écouteur. -->
  <body data-owns-call-socket="true">
    <header data-page-shell></header>
    <main class="page-content">
      <div class="page-heading">
        <h1>Appels</h1>
        <p>Appels vocaux directs, d'un navigateur à l'autre. Rien n'est enregistré.</p>
      </div>

      <!-- Appel en cours : sonnerie, décroché, communication. -->
      <section class="card call-panel" data-call-panel hidden aria-live="assertive">
        <span class="call-panel-avatar" data-call-panel-avatar></span>
        <div class="call-panel-text">
          <h2 data-call-panel-title>Appel</h2>
          <p class="call-panel-status" data-call-panel-status></p>
        </div>
        <div class="call-panel-actions">
          <button class="button" type="button" data-accept-call hidden><span data-icon="phone"></span>Répondre</button>
          <button class="button button-danger" type="button" data-decline-call hidden><span data-icon="phoneOff"></span>Refuser</button>
          <button class="button button-secondary" type="button" data-toggle-mute hidden aria-pressed="false">Couper le micro</button>
          <button class="button button-danger" type="button" data-hang-up hidden><span data-icon="phoneOff"></span>Raccrocher</button>
        </div>
        <!-- Voix de l'interlocuteur (flux WebRTC, jamais enregistré). -->
        <audio data-remote-audio autoplay></audio>
      </section>

      <p class="form-error" data-calls-error role="alert" hidden></p>
      <p class="page-shell-notice" data-signaling-status hidden></p>

      <div class="calls-layout">
        <section class="card">
          <div class="card-header">
            <h2>Collègues</h2>
            <span class="badge badge-accent" data-online-count hidden></span>
          </div>
          <ul class="call-contact-list" data-call-contact-list></ul>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Historique</h2>
          </div>
          <ol class="call-history-list" data-call-history-list></ol>
        </section>
      </div>
    </main>
  </body>
</html>
