<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Diagramme de cas d'utilisation : le technicien s'identifie, décrit une panne, consulte des cas, demande un détail, consulte un code d'erreur et enregistre ses interventions ; le technicien référent classe les nouvelles actions ; deux services externes assistent la compréhension et la recherche.">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3b4f66" stroke-width="1.4"/></marker>
  </defs>
  <rect width="980" height="570" fill="#ffffff"/>

  <!-- Frontière du système -->
  <rect x="215" y="20" width="550" height="530" rx="16" fill="#f6f9fc" stroke="#9fb3c8" stroke-width="1.4"/>
  <text x="235" y="46" font-size="14" font-weight="700" fill="#10243a">Système ATM-Chatbot</text>

  <!-- Acteur : Technicien -->
  <g stroke="#10243a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="90" cy="250" r="14" fill="#fff"/>
    <line x1="90" y1="264" x2="90" y2="306"/>
    <line x1="64" y1="280" x2="116" y2="280"/>
    <line x1="90" y1="306" x2="70" y2="338"/>
    <line x1="90" y1="306" x2="110" y2="338"/>
  </g>
  <text x="90" y="362" font-size="14" font-weight="700" text-anchor="middle" fill="#10243a">Technicien</text>
  <text x="90" y="379" font-size="12" text-anchor="middle" fill="#5b6b7f">sur le terrain</text>

  <!-- Acteur : Technicien référent -->
  <g stroke="#10243a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="890" cy="430" r="14" fill="#fff"/>
    <line x1="890" y1="444" x2="890" y2="486"/>
    <line x1="864" y1="460" x2="916" y2="460"/>
    <line x1="890" y1="486" x2="870" y2="518"/>
    <line x1="890" y1="486" x2="910" y2="518"/>
  </g>
  <text x="890" y="540" font-size="14" font-weight="700" text-anchor="middle" fill="#10243a">Technicien</text>
  <text x="890" y="557" font-size="14" font-weight="700" text-anchor="middle" fill="#10243a">référent</text>

  <!-- Acteurs systèmes externes -->
  <rect x="815" y="88" width="150" height="58" rx="8" fill="#fff4dd" stroke="#c98410"/>
  <text x="890" y="108" font-size="11" text-anchor="middle" fill="#8a5a00">«système externe»</text>
  <text x="890" y="128" font-size="13" font-weight="700" text-anchor="middle" fill="#5c3c00">IA de langage</text>
  <rect x="815" y="250" width="150" height="58" rx="8" fill="#fff4dd" stroke="#c98410"/>
  <text x="890" y="270" font-size="11" text-anchor="middle" fill="#8a5a00">«système externe»</text>
  <text x="890" y="290" font-size="13" font-weight="700" text-anchor="middle" fill="#5c3c00">Moteur de similarité</text>

  <!-- Cas d'utilisation -->
  <g fill="#ffffff" stroke="#1f6fd1" stroke-width="1.6">
    <ellipse cx="490" cy="88" rx="150" ry="24"/>
    <ellipse cx="490" cy="146" rx="150" ry="24"/>
    <ellipse cx="490" cy="204" rx="150" ry="24"/>
    <ellipse cx="490" cy="262" rx="150" ry="24"/>
    <ellipse cx="490" cy="320" rx="150" ry="24"/>
    <ellipse cx="490" cy="378" rx="150" ry="24"/>
    <ellipse cx="490" cy="436" rx="150" ry="24"/>
    <ellipse cx="490" cy="508" rx="150" ry="24" stroke="#127a76" fill="#f2f9f8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#10243a">
    <text x="490" y="93">S'identifier</text>
    <text x="490" y="151">Décrire une panne (écrit ou voix)</text>
    <text x="490" y="209">Consulter les cas similaires</text>
    <text x="490" y="267">Demander le détail d'un cas</text>
    <text x="490" y="325">Consulter un code d'erreur fréquent</text>
    <text x="490" y="383">Enregistrer une intervention</text>
    <text x="490" y="441">Enregistrer une action et son résultat</text>
    <text x="490" y="513">Classer une action dans le catalogue</text>
  </g>

  <!-- Technicien -> cas -->
  <g stroke="#3b4f66" stroke-width="1.3">
    <line x1="118" y1="270" x2="340" y2="88"/>
    <line x1="118" y1="274" x2="340" y2="146"/>
    <line x1="118" y1="278" x2="340" y2="204"/>
    <line x1="118" y1="282" x2="340" y2="262"/>
    <line x1="118" y1="286" x2="340" y2="320"/>
    <line x1="118" y1="290" x2="340" y2="378"/>
    <line x1="118" y1="294" x2="340" y2="436"/>
  </g>

  <!-- Inclusion : décrire une panne inclut la recherche de cas -->
  <path d="M600 163 C 640 172, 640 186, 604 190" fill="none" stroke="#3b4f66" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <text x="648" y="181" font-size="11.5" fill="#5b6b7f" font-style="italic">«inclut»</text>

  <!-- Référent -> classer -->
  <line x1="866" y1="470" x2="640" y2="508" stroke="#3b4f66" stroke-width="1.3"/>

  <!-- Systèmes externes -->
  <g stroke="#c98410" stroke-width="1.3" stroke-dasharray="2 4">
    <line x1="815" y1="112" x2="640" y2="146"/>
    <line x1="815" y1="122" x2="640" y2="204"/>
    <line x1="815" y1="272" x2="640" y2="204"/>
    <line x1="815" y1="286" x2="640" y2="378"/>
  </g>
</svg>
